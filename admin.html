<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><script src="https://telegram.org/js/telegram-web-app.js"></script><title>SpecTech Admin</title><style>
:root{--bg:#f5f6f8;--card:#fff;--text:#17181c;--muted:#8a8f98;--line:#e8e9ed;--accent:#111827;--good:#0f9d58;--warn:#d97706;--bad:#dc2626}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif}.wrap{max-width:920px;margin:auto;padding:18px 16px 32px}.top{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:18px}.eyebrow{font-size:12px;color:var(--muted);font-weight:700;letter-spacing:.08em;text-transform:uppercase}.title{font-size:30px;font-weight:800;margin:3px 0}.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;background:#e9ebef;padding:5px;border-radius:16px;position:sticky;top:8px;z-index:5}.tab{border:0;background:transparent;padding:12px 8px;border-radius:12px;font-weight:700;color:#70757f}.tab.active{background:#fff;color:#111;box-shadow:0 2px 8px #00000010}.section{margin-top:18px}.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:16px;margin-bottom:12px;box-shadow:0 5px 18px #00000006}.machine{display:grid;grid-template-columns:130px 1fr;gap:16px;align-items:center}.machine-img{height:105px;border-radius:18px;background:linear-gradient(135deg,#eef0f4,#d9dde4);display:flex;align-items:center;justify-content:center;font-size:55px;overflow:hidden;background-size:cover;background-position:center}.machine-img span{filter:drop-shadow(0 5px 8px #0002)}.row{display:flex;justify-content:space-between;gap:12px;align-items:center}.name{font-size:18px;font-weight:800}.muted{color:var(--muted);font-size:13px;line-height:1.45}.price{font-size:20px;font-weight:800}.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.chip{padding:6px 9px;border-radius:999px;background:#f1f2f5;font-size:12px;font-weight:700}.actions{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}.btn{border:0;border-radius:12px;padding:10px 13px;font-weight:750;cursor:pointer}.good{background:#e7f7ee;color:#087a43}.bad{background:#feecec;color:#b42318}.dark{background:#111827;color:white}.yellow{background:#fff4df;color:#9a5b00}.empty{text-align:center;padding:35px 15px;color:var(--muted)}.order-head{display:flex;justify-content:space-between;gap:12px}.status{font-size:11px;font-weight:800;padding:6px 8px;border-radius:999px;background:#eef1f5}.live{background:#e9f8ef;color:#087a43}.money{font-size:22px;font-weight:850;margin:8px 0}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:12px}.kv{background:#f7f7f9;border-radius:13px;padding:10px}.kv b{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#111827;color:#fff;padding:11px 15px;border-radius:12px;display:none;font-size:13px;z-index:10}@media(max-width:600px){.machine{grid-template-columns:1fr}.machine-img{height:150px}.tabs{font-size:12px}.grid{grid-template-columns:1fr}}
</style></head><body><main class="wrap"><div class="top"><div><div class="eyebrow">SpecTech</div><div class="title">Панель управления</div><div class="muted">Проверки, платежи и контроль платформы</div></div><div id="count" class="chip">...</div></div><nav class="tabs"><button class="tab active" data-tab="verify">Проверки</button><button class="tab" data-tab="active">Активные</button><button class="tab" data-tab="fleet">Техника</button></nav><section id="content" class="section"></section></main><div id="toast" class="toast"></div><script>
const tg=window.Telegram.WebApp;tg.ready();tg.expand();const headers={'X-Telegram-Init-Data':tg.initData};let current='verify';const content=document.getElementById('content');const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const money=n=>new Intl.NumberFormat('ru-RU',{maximumFractionDigits:0}).format(Number(n||0))+' сум';const icons={'Бетономиксер':'🚚','Автобетононасос':'🏗️','Самосвал':'🚛','Манипулятор':'🏗️','Экскаватор':'🚜','Автокран':'🏗️'};const imgQ={'Бетономиксер':'concrete mixer truck','Автобетононасос':'concrete pump truck','Самосвал':'dump truck','Манипулятор':'truck crane','Экскаватор':'excavator','Автокран':'mobile crane'};const img=c=>`https://loremflickr.com/640/420/${encodeURIComponent(imgQ[c]||'construction equipment')}`;function toast(x){const t=document.getElementById('toast');t.textContent=x;t.style.display='block';setTimeout(()=>t.style.display='none',1800)}async function api(url,opt={}){const r=await fetch(url,{...opt,headers:{...headers,...(opt.headers||{}), 'Content-Type':'application/json'}});if(!r.ok)throw Error(await r.text());return r.json()}
function machine(e,actions=''){return `<div class="card"><div class="machine"><div class="machine-img" style="background-image:url('${img(e.category)}')"><span>${icons[e.category]||'🚧'}</span></div><div><div class="row"><div class="name">${esc(e.brand||e.category)}</div><span class="status">#${e.id}</span></div><div class="muted">${esc(e.category)} · госномер ${esc(e.plate_number||'—')}</div><div class="chips"><span class="chip">${esc(e.owner_name||('ID '+e.owner_id))}</span><span class="chip">${esc(e.owner_phone||'Телефон не указан')}</span><span class="chip">${money(e.price_per_hour)}/ч</span></div>${actions}</div></div></div>`}
async function renderVerify(){const d=await api('/api/admin/pending');document.getElementById('count').textContent=`${d.equipment.length+d.commission.length} задач`;let h='';if(!d.equipment.length&&!d.commission.length&&!d.payments.length)h='<div class="card empty">Все проверки чисты. Новых задач нет.</div>';d.equipment.forEach(e=>h+=machine(e,`<div class="actions"><button class="btn good" onclick="eqAction(${e.id},'approve')">✓ Одобрить технику</button><button class="btn bad" onclick="eqAction(${e.id},'delete')">Удалить</button></div>`));d.payments.forEach(o=>h+=`<div class="card"><div class="eyebrow">Проверка оплаты заказа</div><div class="name">Заказ #${o.id} · ${money(o.final_amount)}</div><div class="muted">Заказчик: ${esc(o.customer_name||o.customer_id)} · ${esc(o.customer_phone||'—')}</div><div class="muted">Водитель: ${esc(o.owner_name||o.owner_id||'—')} · ${esc(o.owner_phone||'—')}</div><div class="actions"><button class="btn good" onclick="payment(${o.id},true)">✓ Деньги поступили</button><button class="btn bad" onclick="payment(${o.id},false)">Не подтверждать</button></div></div>`);d.commission.forEach(o=>h+=`<div class="card"><div class="eyebrow">Комиссия сервиса</div><div class="name">Заказ #${o.id} · ${money(o.commission)}</div><div class="muted">Водитель: ${esc(o.owner_name||o.owner_id)} · ${esc(o.owner_phone||'—')}</div><div class="muted">Водитель отметил, что перевёл комиссию. Проверь поступление на счёт.</div><div class="actions"><button class="btn good" onclick="commission(${o.id},true)">✓ Подтвердить</button><button class="btn bad" onclick="commission(${o.id},false)">Отклонить</button></div></div>`);content.innerHTML=h}
async function renderActive(){const d=await api('/api/admin/active');document.getElementById('count').textContent=`${d.orders.length} работ`;if(!d.orders.length){content.innerHTML='<div class="card empty">Сейчас нет действующих работ.</div>';return}content.innerHTML=d.orders.map(o=>`<div class="card"><div class="order-head"><div><div class="eyebrow">Заказ #${o.id}</div><div class="name">${esc(o.category)}</div></div><span class="status live">${esc(o.status)}</span></div><div class="money" data-start="${esc(o.work_started_at||'')}">${o.work_started_at?'⏱ 00:00:00':'Ожидают начала'}</div><div class="grid"><div class="kv"><b>Заказчик</b>${esc(o.customer_name||'—')}<br><span class="muted">${esc(o.customer_phone||o.customer_id)}</span></div><div class="kv"><b>Водитель</b>${esc(o.owner_name||'—')}<br><span class="muted">${esc(o.owner_phone||o.owner_id||'—')}</span></div><div class="kv"><b>Техника</b>${esc(o.brand||o.category)}<br><span class="muted">${esc(o.plate_number||'—')}</span></div><div class="kv"><b>Цена/час</b>${money(o.price)}<br><span class="muted">${esc(o.date_time)}</span></div></div><div class="muted" style="margin-top:10px">📍 ${esc(o.location||'Геолокация сохранена')}</div></div>`).join('');tick()}
function tick(){document.querySelectorAll('[data-start]').forEach(x=>{const s=x.dataset.start;if(!s)return;x.textContent='⏱ '+fmt((Date.now()-new Date(s).getTime())/1000)})}function fmt(s){s=Math.max(0,Math.floor(s));return [Math.floor(s/3600),Math.floor(s%3600/60),s%60].map(n=>String(n).padStart(2,'0')).join(':')}
async function renderFleet(){const d=await api('/api/admin/equipment');document.getElementById('count').textContent=`${d.equipment.length} единиц`;if(!d.equipment.length){content.innerHTML='<div class="card empty">Подтверждённой техники пока нет.</div>';return}content.innerHTML=d.equipment.map(e=>machine(e,`<div class="actions"><button class="btn ${e.status==='frozen'?'good':'yellow'}" onclick="eqAction(${e.id},'${e.status==='frozen'?'unfreeze':'freeze'}')">${e.status==='frozen'?'Разморозить':'Заморозить'}</button><button class="btn bad" onclick="eqAction(${e.id},'delete')">Удалить</button></div>`)).join('')}
async function eqAction(id,action){await api('/api/admin/equipment/'+id+'/status',{method:'POST',body:JSON.stringify({action})});toast('Готово');load(current)}async function payment(id,approved){await api('/api/admin/payment/'+id,{method:'POST',body:JSON.stringify({approved})});toast(approved?'Оплата подтверждена':'Оплата отклонена');load(current)}async function commission(id,approved){await api('/api/admin/commission/'+id,{method:'POST',body:JSON.stringify({approved})});toast(approved?'Комиссия подтверждена':'Комиссия отклонена');load(current)}
async function load(tab=current){current=tab;try{if(tab==='verify')return await renderVerify();if(tab==='active')return await renderActive();return await renderFleet()}catch(e){console.error(e);content.innerHTML='<div class="card empty">Не удалось обновить данные. Проверьте соединение с ботом.</div>'}}document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');load(b.dataset.tab)});load('verify');setInterval(()=>{if(current==='active')tick();load(current)},3000)
</script></body></html>
