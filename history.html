<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><script src="https://telegram.org/js/telegram-web-app.js"></script><title>История заказов</title><style>
:root{--bg:#f5f6f8;--card:#fff;--text:#17181c;--muted:#8b9099;--line:#e8e9ed;--green:#0f9d58}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif}.wrap{max-width:760px;margin:auto;padding:20px 16px 34px}.eyebrow{font-size:12px;color:var(--muted);font-weight:800;letter-spacing:.08em;text-transform:uppercase}.title{font-size:31px;font-weight:850;margin:4px 0}.sub{color:var(--muted);margin-bottom:18px}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{background:#fff;border:1px solid var(--line);border-radius:18px;padding:13px}.stat b{font-size:22px;display:block}.stat span{font-size:12px;color:var(--muted)}.card{background:#fff;border:1px solid var(--line);border-radius:22px;padding:16px;margin-top:12px;box-shadow:0 6px 22px #00000007}.order{padding:15px 0;border-bottom:1px solid var(--line)}.order:last-child{border-bottom:0}.top{display:flex;justify-content:space-between;gap:12px}.badge{background:#e8f7ef;color:#087a43;border-radius:999px;padding:6px 8px;font-size:11px;font-weight:800}.muted{color:var(--muted);font-size:13px;line-height:1.45}.money{font-size:20px;font-weight:850;margin-top:8px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.kv{background:#f7f7f9;border-radius:13px;padding:10px}.kv b{display:block;font-size:11px;color:var(--muted);margin-bottom:4px}.empty{text-align:center;color:var(--muted);padding:35px}@media(max-width:500px){.summary{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr}}
</style></head><body><main class="wrap"><div class="eyebrow">SpecTech · History</div><div class="title">Мои заказы</div><div class="sub">Вся история: с кем работали, сколько времени и сколько стоила работа.</div><section id="summary" class="summary"></section><section id="orders"></section></main><script>
const tg=window.Telegram.WebApp;tg.ready();tg.expand();const H={'X-Telegram-Init-Data':tg.initData};const money=n=>new Intl.NumberFormat('ru-RU',{maximumFractionDigits:0}).format(Number(n||0))+' сум';const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const fmt=s=>{if(!s)return'—';let x=Math.max(0,Math.round((new Date(s[1])-new Date(s[0]))/1000));return `${Math.floor(x/3600)} ч ${Math.floor(x%3600/60)} мин`};async function load(){const r=await fetch('/api/history',{headers:H});const d=await r.json();const done=d.orders.filter(o=>o.status==='completed');const isOwner=d.role==='owner';document.getElementById('pageTitle').textContent=isOwner?'Мои работы':'История заказов';document.getElementById('pageSub').textContent=isOwner?'Завершённые работы, время, стоимость и комиссия':'Ваши завершённые заказы, техника и стоимость';const total=done.reduce((a,o)=>a+Number(o.final_amount||0),0);const hours=done.reduce((a,o)=>a+(o.work_started_at&&o.work_ended_at?(new Date(o.work_ended_at)-new Date(o.work_started_at))/3600000:0),0);document.getElementById('summary').innerHTML=`<div class="stat"><b>${done.length}</b><span>работ</span></div><div class="stat"><b>${hours.toFixed(1)}ч</b><span>времени</span></div><div class="stat"><b>${money(total).replace(' сум','')}</b><span>оплачено</span></div>`;document.getElementById('orders').innerHTML=done.length?`<div class="card">${done.map(o=>`<article class="order"><div class="top"><div><b>Заказ #${o.id}</b><div class="muted">${esc(o.category)} · ${esc(o.date_time)}</div></div><span class="badge">Завершён</span></div><div class="money">${money(o.final_amount)}</div><div class="grid"><div class="kv"><b>Техника</b>${esc(o.category)}</div><div class="kv"><b>Цена/час</b>${money(o.price)}</div><div class="kv"><b>Время работы</b>${fmt([o.work_started_at,o.work_ended_at])}</div><div class="kv"><b>Оплата</b>${o.payment_method==='card'?'Карта':'Наличные'}</div></div></article>`).join('')}</div>`:'<div class="card empty">История пока пуста.</div>'}load();
</script></body></html>
