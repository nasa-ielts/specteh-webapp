<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>SpecTech</title><script src="https://telegram.org/js/telegram-web-app.js"></script><style>
:root{--bg:var(--tg-theme-bg-color,#000);--text:var(--tg-theme-text-color,#fff);--hint:var(--tg-theme-hint-color,#8e8e93);--btn:var(--tg-theme-button-color,#2481cc);--btntext:var(--tg-theme-button-text-color,#fff);--sec:var(--tg-theme-secondary-bg-color,#1c1c1e)}*{box-sizing:border-box}html,body{margin:0;width:100%;min-height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif}.sheet{min-height:100vh;padding:18px 16px calc(20px + env(safe-area-inset-bottom));display:flex;flex-direction:column}.handle{width:38px;height:4px;border-radius:8px;background:var(--hint);opacity:.35;margin:0 auto 20px}.title{font-size:28px;line-height:1.1;font-weight:700;margin:0 0 6px}.sub{font-size:16px;color:var(--hint);margin-bottom:18px}.wheel-wrap{position:relative;background:var(--sec);border-radius:24px;height:390px;overflow:hidden}.wheel-wrap:before,.wheel-wrap:after{content:"";position:absolute;left:0;right:0;height:105px;z-index:3;pointer-events:none}.wheel-wrap:before{top:0;background:linear-gradient(to bottom,var(--sec),rgba(28,28,30,0))}.wheel-wrap:after{bottom:0;background:linear-gradient(to top,var(--sec),rgba(28,28,30,0))}.selection{position:absolute;left:12px;right:12px;top:50%;height:64px;transform:translateY(-50%);background:rgba(118,118,128,.28);border-radius:32px;z-index:2;pointer-events:none}.wheels{height:100%;display:flex;justify-content:center;gap:12px;position:relative;z-index:1}.wheel{width:120px;height:100%;overflow-y:auto;scroll-snap-type:y mandatory;scrollbar-width:none;padding-top:163px;padding-bottom:163px}.wheel::-webkit-scrollbar{display:none}.item{height:64px;display:flex;align-items:center;justify-content:center;scroll-snap-align:center;font-size:28px;color:var(--hint);transition:color .12s,opacity .12s}.item.active{color:var(--text);font-weight:500}.colon{display:flex;align-items:center;height:100%;font-size:28px;color:var(--text)}.done{margin-top:16px;width:100%;border:0;border-radius:18px;padding:16px;background:var(--btn);color:var(--btntext);font-size:17px;font-weight:700}.done:disabled{opacity:.45}.date-card{background:var(--sec);border-radius:24px;padding:14px}.month{display:flex;align-items:center;justify-content:space-between;font-weight:700}.nav{border:0;background:transparent;color:var(--text);font-size:27px;padding:4px 12px}.week,.days{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}.week{font-size:12px;color:var(--hint);margin:8px 0}.day,.blank{height:40px}.day{border:0;border-radius:12px;background:transparent;color:var(--text);font-size:15px}.day.selected{background:var(--btn);color:var(--btntext)}.day.disabled{opacity:.2}</style></head><body><main class="sheet"><div class="handle"></div><h1 class="title" id="title"></h1><div class="sub" id="sub"></div><section id="content"></section><button id="done" class="done" disabled>Готово</button></main><script>
const tg=window.Telegram.WebApp;tg.ready();tg.expand();const mode=new URLSearchParams(location.search).get('mode')||'date';let selected=null;const title=document.getElementById('title'),sub=document.getElementById('sub'),content=document.getElementById('content'),done=document.getElementById('done');const pad=n=>String(n).padStart(2,'0');
if(mode==='time')initTime();else initDate();
function initTime(){title.textContent='Выберите время';sub.textContent='Прокрутите для выбора времени';content.innerHTML='<div class="wheel-wrap"><div class="selection"></div><div class="wheels"><div class="wheel" id="hours"></div><div class="colon">:</div><div class="wheel" id="mins"></div></div></div>';const hs=document.getElementById('hours'),ms=document.getElementById('mins'),H=Array.from({length:24},(_,i)=>i),M=Array.from({length:60},(_,i)=>i);function update(el){const i=Math.max(0,Math.min(Math.round(el.scrollTop/64),el.children.length-1));[...el.children].forEach((x,j)=>x.classList.toggle('active',j===i));const h=Math.round(hs.scrollTop/64),m=Math.round(ms.scrollTop/64);selected=pad(h)+':'+pad(m);done.disabled=false}function build(el,vals,initial){el.innerHTML=vals.map(v=>'<div class="item" data-v="'+v+'">'+pad(v)+'</div>').join('');el.addEventListener('scroll',()=>update(el),{passive:true});requestAnimationFrame(()=>{el.scrollTop=initial*64;update(el)})}build(hs,H,14);build(ms,M,51);done.onclick=()=>{if(selected)tg.sendData(JSON.stringify({type:'time',value:selected}))}}
function initDate(){title.textContent='Выберите дату';sub.textContent='Можно выбрать одну дату';content.innerHTML='<div class="date-card"><div class="month"><button class="nav" id="prev">‹</button><span id="month"></span><button class="nav" id="next">›</button></div><div class="week"><span>Пн</span><span>Вт</span><span>Ср</span><span>Чт</span><span>Пт</span><span>Сб</span><span>Вс</span></div><div class="days" id="days"></div></div>';let view=new Date(),today=new Date();today.setHours(0,0,0,0);const months=['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];function render(){document.getElementById('month').textContent=months[view.getMonth()]+' '+view.getFullYear();const box=document.getElementById('days');box.innerHTML='';const first=new Date(view.getFullYear(),view.getMonth(),1),off=(first.getDay()+6)%7;for(let i=0;i<off;i++)box.insertAdjacentHTML('beforeend','<div class="blank"></div>');const n=new Date(view.getFullYear(),view.getMonth()+1,0).getDate();for(let d=1;d<=n;d++){const x=new Date(view.getFullYear(),view.getMonth(),d);x.setHours(0,0,0,0);const tomorrow=new Date(today);tomorrow.setDate(today.getDate()+1);const b=document.createElement('button');b.className='day';b.textContent=d;if(x<today||x>tomorrow)b.classList.add('disabled');else b.onclick=()=>{selected=x.getFullYear()+'-'+pad(x.getMonth()+1)+'-'+pad(x.getDate());document.querySelectorAll('.day').forEach(q=>q.classList.remove('selected'));b.classList.add('selected');done.disabled=false};box.appendChild(b)}}render();document.getElementById('prev').onclick=()=>{};document.getElementById('next').onclick=()=>{};done.onclick=()=>{if(selected)tg.sendData(JSON.stringify({type:'date',value:selected}))}}
</script></body></html>
