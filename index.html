<!doctype html><html lang="ru"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>SpecTech</title><script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:var(--tg-theme-bg-color,#fff);--text:var(--tg-theme-text-color,#111);--hint:var(--tg-theme-hint-color,#777);--btn:var(--tg-theme-button-color,#2481cc);--bt:var(--tg-theme-button-text-color,#fff);--sec:var(--tg-theme-secondary-bg-color,#f1f2f4)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.sheet{max-width:460px;margin:auto;padding:16px}.handle{width:38px;height:4px;border-radius:8px;background:var(--hint);opacity:.35;margin:0 auto 16px}.title{font-size:21px;font-weight:700}.sub{font-size:14px;color:var(--hint);margin:4px 0 16px}.card{background:var(--sec);border-radius:20px;padding:14px}.month{display:flex;align-items:center;justify-content:space-between;font-weight:700}.nav{border:0;background:transparent;color:var(--text);font-size:26px;padding:5px 12px}.week,.days{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}.week{font-size:12px;color:var(--hint);margin:8px 0}.day,.blank{height:40px}.day{border:0;border-radius:12px;background:transparent;color:var(--text);font-size:15px}.day.selected{background:var(--btn);color:var(--bt)}.day.disabled{opacity:.22}.times{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.time{border:0;border-radius:14px;padding:13px 6px;background:var(--sec);color:var(--text);font-size:16px}.time.selected{background:var(--btn);color:var(--bt)}.done{width:100%;margin-top:14px;border:0;border-radius:15px;padding:14px;background:var(--btn);color:var(--bt);font-size:16px;font-weight:700}.done:disabled{opacity:.45}
</style></head><body><div class="sheet"><div class="handle"></div><div class="title" id="title"></div><div class="sub" id="sub"></div>
<div id="dateBox" class="card"><div class="month"><button class="nav" id="prev">‹</button><span id="month"></span><button class="nav" id="next">›</button></div><div class="week"><span>Пн</span><span>Вт</span><span>Ср</span><span>Чт</span><span>Пт</span><span>Сб</span><span>Вс</span></div><div class="days" id="days"></div></div>
<div id="timeBox" class="times" style="display:none"></div><button id="done" class="done" disabled>Готово</button></div>
<script>
const tg=window.Telegram.WebApp;tg.ready();tg.expand();const mode=new URLSearchParams(location.search).get("mode")||"date";
let selected=null,view=new Date(),today=new Date();today.setHours(0,0,0,0);
const months=["Январь","Февраль","Март","Апрель","Май","Июнь","Июль","Август","Сентябрь","Октябрь","Ноябрь","Декабрь"],title=document.getElementById("title"),sub=document.getElementById("sub"),done=document.getElementById("done");
title.textContent=mode==="time"?"Выберите время":"Выберите дату";sub.textContent=mode==="time"?"Можно выбрать одно время":"Можно выбрать одну дату";
function dates(){document.getElementById("month").textContent=months[view.getMonth()]+" "+view.getFullYear();let box=document.getElementById("days");box.innerHTML="";let f=new Date(view.getFullYear(),view.getMonth(),1),off=(f.getDay()+6)%7;for(let i=0;i<off;i++){let x=document.createElement("div");x.className="blank";box.appendChild(x)}let n=new Date(view.getFullYear(),view.getMonth()+1,0).getDate();for(let d=1;d<=n;d++){let x=new Date(view.getFullYear(),view.getMonth(),d);x.setHours(0,0,0,0);let b=document.createElement("button");b.className="day";b.textContent=d;if(x<today)b.classList.add("disabled");else b.onclick=()=>{selected=x.toISOString().slice(0,10);document.querySelectorAll(".day").forEach(q=>q.classList.remove("selected"));b.classList.add("selected");done.disabled=false};box.appendChild(b)}}
function times(){document.getElementById("dateBox").style.display="none";let box=document.getElementById("timeBox");box.style.display="grid";for(let h=7;h<=22;h++)for(let m of [0,30]){if(h===22&&m===30)continue;let v=String(h).padStart(2,"0")+":"+String(m).padStart(2,"0"),b=document.createElement("button");b.className="time";b.textContent=v;b.onclick=()=>{selected=v;document.querySelectorAll(".time").forEach(q=>q.classList.remove("selected"));b.classList.add("selected");done.disabled=false};box.appendChild(b)}}
if(mode==="time")times();else dates();document.getElementById("prev").onclick=()=>{view.setMonth(view.getMonth()-1);dates()};document.getElementById("next").onclick=()=>{view.setMonth(view.getMonth()+1);dates()};
done.onclick=()=>{if(selected)tg.sendData(JSON.stringify({type:mode,value:selected}))};
</script></body></html>
