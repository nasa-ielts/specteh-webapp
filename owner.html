<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><script src="https://telegram.org/js/telegram-web-app.js"></script><title>Моя техника</title><style>
:root{--bg:#f4f5f7;--card:#fff;--text:#17181c;--muted:#8a8f98;--line:#e8e9ed;--accent:#111827;--green:#0f9d58}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif}.wrap{max-width:760px;margin:auto;padding:20px 16px 32px}.hero{padding:4px 2px 18px}.eyebrow{font-size:12px;color:var(--muted);font-weight:800;letter-spacing:.08em;text-transform:uppercase}.title{font-size:31px;font-weight:850;margin:4px 0}.sub{color:var(--muted)}.card{background:var(--card);border:1px solid var(--line);border-radius:24px;overflow:hidden;margin:12px 0;box-shadow:0 6px 22px #00000007}.photo{height:210px;background-size:cover;background-position:center;position:relative}.photo:after{content:"";position:absolute;inset:0;background:linear-gradient(to top,#0008,transparent 55%)}.photo .tag{position:absolute;left:14px;bottom:14px;z-index:1;background:#ffffffdc;padding:8px 11px;border-radius:999px;font-weight:800}.body{padding:16px}.name{font-size:21px;font-weight:850}.muted{color:var(--muted);font-size:13px}.chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}.chip{background:#f1f2f5;border-radius:999px;padding:7px 10px;font-size:12px;font-weight:750}.price{font-size:25px;font-weight:850;margin-top:12px}.section-title{font-size:20px;font-weight:850;margin:24px 0 10px}.job{padding:14px 0;border-bottom:1px solid var(--line)}.job:last-child{border-bottom:0}.jobtop{display:flex;justify-content:space-between;gap:10px}.badge{background:#e8f7ef;color:#087a43;border-radius:999px;padding:6px 8px;font-size:11px;font-weight:800}.empty{text-align:center;padding:35px;color:var(--muted)}
</style></head><body><main class="wrap"><header class="hero"><div class="eyebrow">SpecTech · Garage</div><div class="title">Моя техника</div><div class="sub" id="hello">Ваш парк и история работ</div></header><section id="fleet"></section><div class="section-title">Предыдущие работы</div><section id="jobs"></section></main><script>
const tg=window.Telegram.WebApp;tg.ready();tg.expand();const H={'X-Telegram-Init-Data':tg.initData,'Authorization':'tma '+tg.initData};const API=(path)=>path+(path.includes('?')?'&':'?')+'initData='+encodeURIComponent(tg.initData||'');const money=n=>new Intl.NumberFormat('ru-RU',{maximumFractionDigits:0}).format(Number(n||0))+' сум';const imgQ={'Бетономиксер':'concrete mixer truck','Автобетононасос':'concrete pump truck','Самосвал':'dump truck','Манипулятор':'truck crane','Экскаватор':'excavator','Автокран':'mobile crane'};const img=c=>`https://loremflickr.com/900/520/${encodeURIComponent(imgQ[c]||'construction equipment')}`;const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));function fmt(sec){sec=Math.max(0,Math.round(sec||0));return `${Math.floor(sec/3600)} ч ${Math.floor(sec%3600/60)} мин`}async function load(){try{const r=await fetch(API('/api/owner'),{headers:H});if(!r.ok)throw Error(await r.text());const d=await r.json();document.getElementById('hello').textContent=`${d.equipment.length} единиц техники · владелец`;document.getElementById('fleet').innerHTML=d.equipment.length?d.equipment.map(e=>`<article class="card"><div class="photo" style="background-image:url('${img(e.category)}')"><div class="tag">${esc(e.category)}</div></div><div class="body"><div class="name">${esc(e.brand||'Без марки')}</div><div class="muted">Госномер: ${esc(e.plate_number||'—')} · ${e.year||'год не указан'}</div><div class="chips"><span class="chip">${esc(e.verification_status)}</span><span class="chip">${esc(e.status)}</span></div><div class="price">${money(e.price_per_hour)} <span class="muted">/ час</span></div></div></article>`).join(''):'<div class="card empty">Техники пока нет.</div>';const jobs=d.orders.filter(o=>o.status==='completed');document.getElementById('jobs').innerHTML=jobs.length?`<div class="card" style="padding:16px">${jobs.map(o=>`<div class="job"><div class="jobtop"><div><b>Заказ #${o.id}</b><div class="muted">${esc(o.category)} · ${esc(o.date_time)}</div></div><span class="badge">Завершён</span></div><div style="margin-top:8px">${o.work_started_at&&o.work_ended_at?fmt((new Date(o.work_ended_at)-new Date(o.work_started_at))/1000):'—'} · <b>${money(o.final_amount)}</b></div><div class="muted">Комиссия сервиса: ${money(o.commission)}</div></div>`).join('')}</div>`:'<div class="card empty">Предыдущих работ пока нет.</div>'}load();
</script></body></html>
